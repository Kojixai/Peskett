# FlipOS — Nginx config for hill.work/peskett
# Place at: /etc/nginx/sites-available/hill.work
# Symlink: ln -s /etc/nginx/sites-available/hill.work /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name hill.work www.hill.work;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hill.work www.hill.work;

    # SSL — replace with your cert paths (or use certbot)
    ssl_certificate     /etc/letsencrypt/live/hill.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hill.work/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # FlipOS at /peskett
    location /peskett {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js static files
    location /peskett/_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Root — redirect to /peskett
    location = / {
        return 302 /peskett;
    }
}
